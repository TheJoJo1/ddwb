# DDWB - NGINX Configuration
# PHP-FPM configuration for DDWB (DingeDieWirBesitzen)
# 
# This configuration is for NGINX with PHP-FPM (FastCGI Process Manager)
# Tested with NGINX 1.18+ and PHP 8.4+
#
# Usage:
# 1. Copy this file to /etc/nginx/sites-available/ddwb
# 2. Create symlink: ln -s /etc/nginx/sites-available/ddwb /etc/nginx/sites-enabled/ddwb
# 3. Test configuration: nginx -t
# 4. Reload NGINX: systemctl reload nginx

# Main server block
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS (uncomment for production)
    # return 301 https://$server_name$request_uri;

    root /var/www/ddwb/public;
    index index.php;

    # Error logging
    error_log /var/log/nginx/ddwb_error.log;
    access_log /var/log/nginx/ddwb_access.log;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to sensitive files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (\.env|composer\.json|composer\.lock|\.git|\.htaccess|\.htpasswd|README\.md|LICENSE) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to core, config, database, storage, vendor directories
    location ~* /(config|core|database|storage|vendor|modules/.*/(routes|controllers|models|services|repositories))/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny PHP files in public directory (except index.php)
    location ~* /public/.+\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Front controller - route all requests through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        # Deny direct access to PHP files in other directories
        if ($uri !~ /index\.php) {
            return 404;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        
        # PHP-FPM settings
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        
        # Environment variables
        fastcgi_param DDWB_ENV production;
        
        # Buffer settings
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 24k;
        fastcgi_temp_file_write_size 256k;
        
        # Timeout settings
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # Prevent directory listing
    autoindex off;

    # Error pages
    error_page 403 /403;
    error_page 404 /404;
    error_page 500 502 503 504 /500;

    # Custom error handling
    location = /403 {
        try_files /403.html /index.php?$query_string;
    }

    location = /404 {
        try_files /404.html /index.php?$query_string;
    }

    location = /500 {
        try_files /500.html /index.php?$query_string;
    }
}

